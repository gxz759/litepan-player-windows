version: 1.0.{build}

image: Visual Studio 2022

clone_depth: 1

install:
  - ps: |
      $rustup = "$env:TEMP\rustup-init.exe"
      Invoke-WebRequest `
        -Uri "https://win.rustup.rs/x86_64" `
        -OutFile $rustup

      & $rustup -y `
        --default-toolchain stable-x86_64-pc-windows-msvc `
        --profile minimal

      $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"

      rustc --version
      cargo --version

  - ps: |
      $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
      cargo install tauri-cli --locked
      cargo-tauri --version

before_build:
  - ps: |
      $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"

      $release = Invoke-RestMethod `
        -Uri "https://api.github.com/repos/zhongfly/mpv-winbuild/releases/latest" `
        -Headers @{ "User-Agent" = "AppVeyor" }

      $asset = $release.assets |
        Where-Object {
          $_.name -match '^mpv-x86_64-\d{8}-git-[0-9a-f]+\.7z$'
        } |
        Select-Object -First 1

      if ($null -eq $asset) {
        $release.assets | Select-Object -ExpandProperty name
        throw "找不到 x86_64 Windows mpv 压缩包"
      }

      New-Item -ItemType Directory -Force -Path "bin" | Out-Null

      $archive = "$env:TEMP\mpv-x86_64.7z"
      $extract = "$env:TEMP\mpv-extract-$env:APPVEYOR_BUILD_ID"

      Invoke-WebRequest `
        -Uri $asset.browser_download_url `
        -OutFile $archive

      New-Item -ItemType Directory -Force -Path $extract | Out-Null

      7z x $archive "-o$extract" -y

      $mpv = Get-ChildItem `
        -Path $extract `
        -Filter "mpv.exe" `
        -Recurse `
        -File |
        Select-Object -First 1

      if ($null -eq $mpv) {
        7z l $archive
        throw "mpv 压缩包中找不到 mpv.exe"
      }

      Copy-Item `
        -Path $mpv.FullName `
        -Destination "bin\mpv.exe" `
        -Force

      if (-not (Test-Path "bin\mpv.exe" -PathType Leaf)) {
        throw "bin\mpv.exe 复制失败"
      }

build_script:
  - ps: |
      $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"

      cargo tauri build `
        --manifest-path "src-tauri\Cargo.toml"

artifacts:
  - path: "src-tauri\target\release\bundle\nsis\*.exe"
    name: litepan-player-windows-installer
