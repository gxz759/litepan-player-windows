version: 1.0.{build}

image: Visual Studio 2022

install:
  - rustup toolchain install stable-x86_64-pc-windows-msvc
  - rustup default stable-x86_64-pc-windows-msvc
  - cargo install tauri-cli --locked

before_build:
  - ps: |
      $release = Invoke-RestMethod "https://api.github.com/repos/zhongfly/mpv-winbuild/releases/latest"
      $asset = $release.assets | Where-Object {
        $_.name -match '^mpv-x86_64-\d{8}-git-[0-9a-f]+\.7z$'
      } | Select-Object -First 1
      New-Item -ItemType Directory -Force -Path bin | Out-Null
      Invoke-WebRequest $asset.browser_download_url -OutFile "$env:TEMP\mpv.7z"
      7z x "$env:TEMP\mpv.7z" "-o$env:TEMP\mpv-extract" -y
      $mpv = Get-ChildItem "$env:TEMP\mpv-extract" -Filter mpv.exe -Recurse | Select-Object -First 1
      Copy-Item $mpv.FullName "bin\mpv.exe"

build_script:
  - cargo tauri build --manifest-path src-tauri/Cargo.toml

artifacts:
  - path: src-tauri\target\release\bundle\nsis\*.exe
    name: litepan-player-windows-installer
